name: Release

on:
  push:
    tags: ["v*"]

permissions:
  id-token: write  # for PyPI trusted publisher (OIDC)
  contents: write  # for GitHub Release

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3
      - run: uv python install 3.12
      - run: uv sync
      - name: Build sdist + wheel
        run: uv build
      - uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    environment: pypi
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: dist
          path: dist/
      - name: Publish to PyPI
        # release/v1 as of 2026-07-28. The previous pin (cef2210, 2026-02-18) shipped
        # twine 6.1.0, which rejects the Metadata-Version 2.5 that current hatchling
        # writes: the v0.5.0 tag failed with "'2.5' is not a valid metadata version".
        # Measured on the built wheel: twine 6.1.0 ERROR, twine 7.0.0 (this pin) PASSED.
        uses: pypa/gh-action-pypi-publish@dc37677b2e1c63e2034f94d8a5b11f265b73ba33 # release/v1
        # Trusted publisher — no API key needed

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="${{ github.ref_name }}"
          gh release create "$TAG" \
            --title "$TAG" \
            --notes "See CHANGELOG.md for details"
