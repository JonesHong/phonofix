name: CI

on:
  push:
    branches: [main, "v0.4-dev"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@caf0cab7a618c569241d31dcd442f54681755d39 # v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      # Before `uv sync`, not after: on 3.13 there is no python-mecab-ko wheel, so uv
      # builds it from source and the build calls mecab-config. With this step second,
      # ubuntu/macOS 3.13 died at install with "RuntimeError: mecab-config not found"
      # while 3.10-3.12 passed on prebuilt wheels (2026-09-16).
      - name: Install system deps (espeak-ng for en backend, mecab for ja/ko)
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y espeak-ng mecab libmecab-dev mecab-ipadic-utf8
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install espeak-ng mecab
          fi
        shell: bash

      # The English backend needs espeak-ng itself, not just phonemizer. Windows has no
      # package for it, and without it 15 tests raised RuntimeError rather than skipping,
      # which is what the old "en/ja tests will skip" comment assumed.
      - name: Install espeak-ng (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          $url = "https://github.com/espeak-ng/espeak-ng/releases/download/1.52.0/espeak-ng.msi"
          Invoke-WebRequest -Uri $url -OutFile espeak-ng.msi
          Start-Process msiexec.exe -ArgumentList "/i","espeak-ng.msi","/quiet","/norestart" -Wait
          "PHONEMIZER_ESPEAK_LIBRARY=C:\Program Files\eSpeak NG\libespeak-ng.dll" |
            Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Windows skips the ko extra (and `all`, which repeats it): python-mecab-ko
      # publishes no 3.13 wheel and its source build wants mecab.h, which Windows
      # has no package for — 2026-09-16 that was the last red job in the matrix.
      # Korean stays covered on Linux and macOS.
      - name: Install dependencies
        shell: bash
        run: |
          if [ "$RUNNER_OS" == "Windows" ]; then
            uv sync --dev --extra ch --extra en --extra ja
          else
            uv sync --all-extras --dev
          fi

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest tests/ -q --ignore=tests/test_english_corrector.py
        # English corrector tests require espeak-ng setup that may not match
        # GitHub runner env; covered by separate matrix job below.
