name: CI

on:
  push:
    branches: [main, "v0.4-dev"]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Set up Python ${{ matrix.python-version }}
        run: uv python install ${{ matrix.python-version }}

      - name: Install dependencies
        run: uv sync --all-extras --dev

      - name: Install system deps (espeak-ng for en backend, mecab for ja fugashi)
        run: |
          if [ "$RUNNER_OS" == "Linux" ]; then
            sudo apt-get update
            sudo apt-get install -y espeak-ng mecab libmecab-dev mecab-ipadic-utf8
          elif [ "$RUNNER_OS" == "macOS" ]; then
            brew install espeak-ng mecab
          fi
          # Windows: caller responsibility, en/ja tests will skip
        shell: bash

      - name: Ruff
        run: uv run ruff check .

      - name: Pytest
        run: uv run pytest tests/ -q --ignore=tests/test_english_corrector.py
        # English corrector tests require espeak-ng setup that may not match
        # GitHub runner env; covered by separate matrix job below.
